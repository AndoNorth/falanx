[package]
name = "falanx-engine"
version = "0.1.0"
edition = "2024"

[lib]
name = "falanx_engine"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
dotenvy = "0.15"
tokio = { version = "1", features = ["full"] }
dirs = "5"

[dev-dependencies]
tempfile = "3"
